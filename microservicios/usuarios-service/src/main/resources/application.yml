server:
  port: 8081

spring:
  application:
    name: usuarios-service
  datasource:
    # Por defecto: H2 en archivo (no requiere instalar nada). Para MySQL: --spring.profiles.active=mysql
    url: jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true   # http://localhost:8081/h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/usuarios_db?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  h2:
    console:
      enabled: false
